<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Birth of Space</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; }
  </style>
</head>
<body>

<a-scene embedded arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">
  <a-marker id="markerA" type="pattern" url="assets/marker.patt">
    <a-entity id="stageRoot"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="2" position="2 5 3"></a-light>
</a-scene>

<script>
const root = document.querySelector("#stageRoot");

function recognition(){
  // ACT I — Recognition
  const pulse=document.createElement("a-circle");
  pulse.setAttribute("radius","0.5");
  pulse.setAttribute("color","#0ff");
  pulse.setAttribute("opacity","0.2");
  pulse.setAttribute("animation","property: scale; from:0.1 0.1 0.1; to:2 2 2; dur:3000; easing:easeOutQuad");
  root.appendChild(pulse);
  console.log("Reality detected.");
}

function singularity(){
  // ACT II — Singularity
  const point=document.createElement("a-sphere");
  point.setAttribute("radius","0.01");
  point.setAttribute("color","#fff");
  point.setAttribute("animation","property: scale; dir: alternate; dur:200; loop:true; to:0.02 0.02 0.02");
  root.appendChild(point);

  // inward particles
  for(let i=0;i<30;i++){
    const p=document.createElement("a-sphere");
    p.setAttribute("radius","0.005");
    p.setAttribute("color","#0ff");
    const x=(Math.random()-0.5)*2, y=(Math.random()-0.5)*2, z=(Math.random()-0.5)*2;
    p.setAttribute("position",`${x} ${y} ${z}`);
    p.setAttribute("animation",`property: position; to:0 0 0; dur:3000; easing:easeInQuad`);
    root.appendChild(p);
  }
}

function birth(){
  // ACT III — Birth
  for(let i=0;i<200;i++){
    const p=document.createElement("a-sphere");
    p.setAttribute("radius","0.005");
    p.setAttribute("color","#fff");
    const x=(Math.random()-0.5)*3, y=(Math.random()-0.5)*3, z=(Math.random()-0.5)*3;
    p.setAttribute("position","0 0 0");
    p.setAttribute("animation",`property: position; to:${x} ${y} ${z}; dur:2000; easing:easeOutQuad;`);
    root.appendChild(p);
  }
}

function orderEmerges(){
  // ACT IV — Order Emerges
  // Example: connect particles into lines
  const line=document.createElement("a-cylinder");
  line.setAttribute("color","#0ff");
  line.setAttribute("radius","0.002");
  line.setAttribute("height","1");
  line.setAttribute("position","0 0 0.5");
  root.appendChild(line);
}

function consciousness(){
  // ACT V — Consciousness
  root.setAttribute("animation__pulse","property: scale; dir: alternate; dur:2000; loop:true; to:1.05 1.05 1.05");
}

function rotation(){
  // ACT VI — Rotation
  root.setAttribute("animation__rotate","property: rotation; to:360 360 360; loop:true; dur:60000");
}

function metamorphosis(){
  // ACT VII — Metamorphosis
  const cube=document.createElement("a-box");
  cube.setAttribute("depth","0.5");
  cube.setAttribute("height","0.5");
  cube.setAttribute("width","0.5");
  cube.setAttribute("material","wireframe:true; color:#0ff");
  root.appendChild(cube);
  // unfolding would be scripted with custom component
}

function portal(){
  // ACT VIII — Portal
  for(let i=0;i<5;i++){
    const ring=document.createElement("a-ring");
    ring.setAttribute("radius-inner",0.2+i*0.05);
    ring.setAttribute("radius-outer",0.25+i*0.05);
    ring.setAttribute("color","#0ff");
    ring.setAttribute("rotation",`0 ${i*45} 0`);
    ring.setAttribute("animation",`property: rotation; to:0 360 0; loop:true; dur:${10000+i*2000}`);
    root.appendChild(ring);
  }
}

function information(){
  // ACT IX — Information
  const text=document.createElement("a-text");
  text.setAttribute("value","Tony");
  text.setAttribute("align","center");
  text.setAttribute("color","#fff");
  text.setAttribute("position","0 0.5 0");
  text.setAttribute("animation","property: opacity; from:0; to:1; dur:4000");
  root.appendChild(text);
}

function invitation(){
  // ACT X — Invitation
  console.log("Spatial Computing isn't about placing objects in reality. It's about revealing what reality can become.");
}

// Stage array
const stages=[
  recognition,
  singularity,
  birth,
  orderEmerges,
  consciousness,
  rotation,
  metamorphosis,
  portal,
  information,
  invitation
];

function runGenesis(){
  let i=0;
  function next(){
    stages[i++]();
    if(i<stages.length) setTimeout(next,5000);
  }
  next();
}

// Trigger on marker detection
const marker=document.querySelector("#markerA");
marker.addEventListener("markerFound",()=>{
  runGenesis();
});
</script>

</body>
</html>
