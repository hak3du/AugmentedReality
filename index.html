<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Genesis Sequence</title>

  <!-- Stable A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; }
  </style>
</head>
<body>

<a-scene
  embedded
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <a-marker id="markerA" type="pattern" url="assets/marker.patt">
    <a-entity id="seed"></a-entity>
    <a-entity id="particles"></a-entity>
    <a-entity id="harmonics"></a-entity>
    <a-entity id="connections"></a-entity>
    <a-entity id="cube"></a-entity>
    <a-entity id="portal"></a-entity>
    <a-entity id="identity"></a-entity>
  </a-marker>

  <a-entity camera></a-entity>
  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="2" position="2 5 3"></a-light>
</a-scene>

<script>
const seed = document.querySelector("#seed");
const particles = document.querySelector("#particles");
const harmonics = document.querySelector("#harmonics");
const connections = document.querySelector("#connections");
const cube = document.querySelector("#cube");
const portal = document.querySelector("#portal");
const identity = document.querySelector("#identity");

let current = 0;

// Stage functions
function stage0_markerFound(){
  console.log("Marker detected. Genesis begins.");
}

function stage1_seed(){
  const s = document.createElement("a-sphere");
  s.setAttribute("radius","0.05");
  s.setAttribute("color","#00f");
  s.setAttribute("material","emissive:#00f; emissiveIntensity:0.8");
  s.setAttribute("animation__pulse","property: scale; dir: alternate; dur:2000; loop:true; to:0.07 0.07 0.07");
  seed.appendChild(s);
}

function stage2_expansion(){
  for(let i=0;i<20;i++){
    const p=document.createElement("a-sphere");
    p.setAttribute("radius","0.01");
    p.setAttribute("color","#0ff");
    p.setAttribute("position","0 0 0");
    const x=(Math.random()-0.5)*1.5;
    const y=(Math.random()-0.5)*1.5;
    const z=(Math.random()-0.5)*1.5;
    p.setAttribute("animation__move",`property: position; to:${x} ${y} ${z}; dur:2500; easing:easeOutQuad`);
    p.setAttribute("animation__fade","property: opacity; to:0; dur:2500; easing:linear");
    particles.appendChild(p);
  }
}

function stage3_harmonics(){
  for(let i=0;i<8;i++){
    const angle=(i/8)*Math.PI*2;
    const s=document.createElement("a-sphere");
    s.setAttribute("radius","0.03");
    s.setAttribute("color","#0ff");
    s.setAttribute("position",`${Math.cos(angle)*0.3} 0 ${Math.sin(angle)*0.3}`);
    harmonics.appendChild(s);
  }
}

function stage4_connections(){
  const spheres=harmonics.querySelectorAll("a-sphere");
  for(let i=0;i<spheres.length;i++){
    for(let j=i+1;j<spheres.length;j++){
      const a=spheres[i].getAttribute("position").split(" ").map(Number);
      const b=spheres[j].getAttribute("position").split(" ").map(Number);
      const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
      const dx=b[0]-a[0], dy=b[1]-a[1], dz=b[2]-a[2];
      const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
      const cyl=document.createElement("a-cylinder");
      cyl.setAttribute("color","#0ff");
      cyl.setAttribute("radius","0.005");
      cyl.setAttribute("height",dist);
      cyl.setAttribute("position",mid.join(" "));
      cyl.setAttribute("rotation","90 0 0");
      connections.appendChild(cyl);
    }
  }
}

function stage5_cube(){
  const b=document.createElement("a-box");
  b.setAttribute("depth","0.5");
  b.setAttribute("height","0.5");
  b.setAttribute("width","0.5");
  b.setAttribute("material","wireframe:true; color:#0ff");
  b.setAttribute("animation__rotate","property: rotation; to:0 360 0; loop:true; dur:60000");
  cube.appendChild(b);
}

function stage6_resonance(){
  cube.setAttribute("animation__pulse","property: scale; dir: alternate; dur:2000; loop:true; to:1.02 1.02 1.02");
}

function stage7_spiral(){
  const comet=document.createElement("a-sphere");
  comet.setAttribute("radius","0.01");
  comet.setAttribute("color","#fff");
  // Spiral motion would be scripted with JS tick or custom component
  portal.appendChild(comet);
}

function stage8_portal(){
  const ring=document.createElement("a-ring");
  ring.setAttribute("radius-inner","0.3");
  ring.setAttribute("radius-outer","0.35");
  ring.setAttribute("color","#0ff");
  ring.setAttribute("animation__expand","property: scale; from:0.1 0.1 0.1; to:8 8 8; dur:6000; easing:easeOutQuad");
  portal.appendChild(ring);
}

function stage9_identity(){
  const text=document.createElement("a-text");
  text.setAttribute("value","Tony — Reality, Reimagined");
  text.setAttribute("align","center");
  text.setAttribute("color","#fff");
  text.setAttribute("position","0 0.5 0");
  text.setAttribute("animation__fade","property: opacity; from:0; to:1; dur:4000");
  identity.appendChild(text);
}

function stage10_world(){
  console.log("Load next world (Atlas, TradingOS, PortfolioOS, etc.)");
}

// Stage array
const stages=[
  stage0_markerFound,
  stage1_seed,
  stage2_expansion,
  stage3_harmonics,
  stage4_connections,
  stage5_cube,
  stage6_resonance,
  stage7_spiral,
  stage8_portal,
  stage9_identity,
  stage10_world
];

function runGenesis(){
  let i=0;
  function next(){
    stages[i++]();
    if(i<stages.length) setTimeout(next,5000);
  }
  next();
}

// Trigger on marker detection
const marker=document.querySelector("#markerA");
marker.addEventListener("markerFound",()=>{
  runGenesis();
});
</script>

</body>
</html>
