<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLTF Debug Test</title>

  <!-- Use a stable A-Frame version -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="audi.glb"></script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; }
  </style>
</head>
<body>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  loading-screen="enabled:false"
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <!-- Asset preload -->
  <a-assets timeout="10000">
    <!-- Swap this for your audi.glb once test passes -->
    <a-asset-item id="boxModel" src="https://cdn.aframe.io/test-models/models/box/Box.gltf"></a-asset-item>
  </a-assets>

  <!-- Marker -->
  <a-marker id="markerA" preset="hiro">

    <!-- Debug cube -->
    <a-box color="red" depth="0.1" width="0.1" height="0.1"></a-box>

    <!-- Test GLTF model -->
    <a-entity
      id="model"
      gltf-model="#boxModel"
      scale="1 1 1"
      position="0 0.2 0"
      rotation="-90 0 0">
    </a-entity>

    <!-- Primitive sanity check -->
    <a-sphere radius="0.15" color="blue" position="0 0.3 0"></a-sphere>

  </a-marker>

  <a-entity camera></a-entity>

  <!-- Lighting -->
  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="2" position="2 5 3"></a-light>
</a-scene>

<script>
const model = document.querySelector("#model");
const marker = document.querySelector("#markerA");

model.addEventListener("model-loaded", () => {
  console.log("MODEL LOADED");
  const mesh = model.getObject3D("mesh");
  console.log(mesh);
  const box = new THREE.Box3().setFromObject(mesh);
  console.log("Bounding Box:", box);
  console.log("Size:", box.getSize(new THREE.Vector3()));
});

model.addEventListener("model-error", e => {
  console.error("MODEL ERROR", e);
  alert("GLB failed to load");
});

marker.addEventListener("markerFound", () => {
  console.log("MARKER FOUND");
});

marker.addEventListener("markerLost", () => {
  console.log("MARKER LOST");
});
</script>

</body>
</html>
