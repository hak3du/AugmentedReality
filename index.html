<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio AR</title>

  <!-- Latest A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Extras -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; font-family:sans-serif; }

    /* Fixed UI overlay */
    #uiOverlay {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      display:none; z-index:9999;
      background:rgba(17,17,17,0.85); padding:12px 20px; border-radius:12px;
      text-align:center; color:white;
    }
    #uiOverlay button {
      display:block; width:100%; margin:8px 0; padding:12px;
      font-size:16px; border:none; border-radius:8px; cursor:pointer;
    }

    /* Floating video card */
    #videoOverlay {
      display:none;
      position:fixed;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:720px; max-width:90vw;
      aspect-ratio:16/9;
      background:#111;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      z-index:10000;
    }
    #youtubeFrame { width:100%; height:100%; border:none; }
    #closeVideo {
      position:absolute; top:10px; right:10px;
      background:white; border:none; border-radius:8px;
      padding:8px 14px; cursor:pointer;
    }
  </style>
</head>
<body>

<!-- UI overlay -->
<div id="uiOverlay">
  <div>Portfolio AR</div>
  <button id="videoButton">▶ Watch Introduction</button>
  <button id="modelButton">🚗 Show Audi</button>
  <button id="closeUI">❌ Close</button>
</div>

<!-- Video overlay -->
<div id="videoOverlay">
  <button id="closeVideo">Close</button>
  <iframe
    id="youtubeFrame"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  loading-screen="enabled:false"
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <a-assets>
    <a-asset-item id="audiAsset" src="assets/audi.glb"></a-asset-item>
  </a-assets>

  <!-- Marker anchors only the model -->
  <a-marker id="markerA" type="pattern" url="assets/marker.patt">
    <a-entity id="audiModel"
              visible="false"
              gltf-model="#audiAsset"
              position="0 0 0"
              rotation="0 0 0"
              scale="10 10 10">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const sceneEl = document.querySelector("a-scene");
sceneEl.addEventListener("loaded", () => {
  const marker = document.querySelector("#markerA");
  const model  = document.querySelector("#audiModel");
  const ui     = document.getElementById("uiOverlay");
  const overlay= document.getElementById("videoOverlay");
  const frame  = document.getElementById("youtubeFrame");

  let lostTimeout;

  marker.addEventListener("markerFound", () => {
    clearTimeout(lostTimeout);
    ui.style.display = "block";
  });

  marker.addEventListener("markerLost", () => {
    lostTimeout = setTimeout(() => {
      ui.style.display = "none";
      model.setAttribute("visible", false);
      overlay.style.display = "none";
      frame.removeAttribute("src");
    }, 800);
  });

  // Button handlers
  document.getElementById("videoButton").onclick = () => {
    ui.style.display = "none";
    overlay.style.display = "block";
    frame.src = "https://www.youtube.com/embed/YOUR_VIDEO_ID?autoplay=1";
  };

  document.getElementById("modelButton").onclick = () => {
    ui.style.display = "none";
    overlay.style.display = "none";
    frame.removeAttribute("src");
    model.setAttribute("visible", true);
    model.object3D.visible = true;
  };

  document.getElementById("closeUI").onclick = () => {
    ui.style.display = "none";
    model.setAttribute("visible", false);
  };

  document.getElementById("closeVideo").onclick = () => {
    overlay.style.display = "none";
    frame.removeAttribute("src");
  };

  // Debug model load
  model.addEventListener("model-loaded", () => {
    console.log("Audi loaded!");
    console.log(model.object3D);

    // Center the model automatically
    const obj = model.getObject3D("mesh");
    if (obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const center = new THREE.Vector3();
      box.getCenter(center);
      obj.position.sub(center);
    }
  });
});
</script>

</body>
</html>
