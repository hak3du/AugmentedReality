<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio AR Debug</title>

  <!-- Latest A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Extras -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; font-family:sans-serif; }
    #debugPanel {
      position:fixed; top:10px; left:10px;
      background:rgba(0,0,0,0.7); color:#0f0;
      padding:10px; border-radius:8px; font-family:monospace;
      white-space:pre; z-index:9999;
    }
  </style>
</head>
<body>

<div id="debugPanel">❌ Marker\n❌ GLB\n❌ Visible</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  loading-screen="enabled:false"
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <!-- Use official test model instead of audi.glb -->
  <a-marker id="markerA" type="pattern" url="assets/marker.patt">
    <a-entity id="audiModel"
              visible="false"
              gltf-model="https://cdn.aframe.io/test-models/models/box/Box.gltf"
              position="0 0 0"
              scale="1 1 1">
    </a-entity>
    <!-- Debug cube -->
    <a-box color="red" depth="0.1" width="0.1" height="0.1" position="0 0 0"></a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const marker = document.querySelector("#markerA");
const model  = document.querySelector("#audiModel");
const debug  = document.getElementById("debugPanel");

let lostTimeout;

function updateDebug(status) {
  debug.textContent = status;
}

marker.addEventListener("markerFound", () => {
  clearTimeout(lostTimeout);
  updateDebug("🟢 Marker Found\n❌ GLB\n❌ Visible");
});

marker.addEventListener("markerLost", () => {
  lostTimeout = setTimeout(() => {
    model.setAttribute("visible", false);
    updateDebug("❌ Marker Lost");
  }, 800);
});

model.addEventListener("model-loaded", () => {
  const obj = model.getObject3D("mesh");
  if (obj) {
    // Force visibility
    obj.traverse((node) => {
      if (node.isMesh) {
        node.visible = true;
        node.material.side = THREE.DoubleSide;
        node.frustumCulled = false;
        node.geometry.computeBoundingBox();
        console.log(node.name, node.geometry.boundingBox);
      }
    });

    // Center the model
    const box = new THREE.Box3().setFromObject(obj);
    const center = new THREE.Vector3();
    box.getCenter(center);
    obj.position.sub(center);

    const size = new THREE.Vector3();
    box.getSize(size);

    updateDebug(
`🟢 Marker Found
🟢 GLB Loaded
Visible = ${model.getAttribute("visible")}
Scale: ${model.getAttribute("scale")}
Position: ${model.getAttribute("position")}
Bounds: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`
    );
  }
});
</script>

</body>
</html>
